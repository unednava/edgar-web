<!doctype html>
<!--
  Plantilla de la imagen para redes (public/og.png, 1200x630). Estilo: toques de collage.
  Para regenerarla: abre este archivo en Chrome con una ventana de 1200x630
  y haz una captura (DevTools → "Capture screenshot"). O pídeselo a Claude.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 200 800; src: url('../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2-variations'); }</style>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f2f2ef; color: #141414;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  .mark { width: 54px; height: 64px; }
  h1 { font-size: 84px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 800; max-width: 720px; }
  .hl { position: relative; z-index: 0; white-space: nowrap; }
  .hl::before { content: ''; position: absolute; z-index: -1; inset: 0.08em -0.14em 0.02em -0.12em; background: #fcd812; transform: rotate(-1.6deg); border-radius: 2px; }
  .dot { margin-left: -0.08em; }
  .sub { font-size: 30px; font-weight: 500; color: #45474d; max-width: 600px; text-wrap: balance; }
  .piece { position: absolute; filter: drop-shadow(0 8px 12px rgba(20, 20, 20, 0.2)); }
  .bulb { right: 40px; top: 70px; width: 340px; transform: rotate(9deg); }
  .mega { right: 300px; bottom: -40px; width: 200px; transform: rotate(-12deg); }
</style>
</head>
<body>
  <img class="piece bulb" src="../public/collage/bombilla-estrellas.webp" alt="" />
  <img class="piece mega" src="../public/collage/megafono.webp" alt="" />
  <div class="brand"><img class="mark" src="../public/brand/llama.webp" alt="" />Edgar Navarro</div>
  <h1>Marketing con IA que sí <span class="hl">funciona</span><span class="dot">.</span></h1>
  <p class="sub">Lo que aprendí gastando presupuesto de verdad.</p>
</body>
</html>
