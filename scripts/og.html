<!doctype html>
<!--
  Plantilla de la imagen para redes (public/og.png, 1200x630).
  Usa las ilustraciones de public/edgar/. Para regenerarla: abre este archivo en Chrome
  con una ventana de 1200x630 y haz una captura (DevTools → "Capture screenshot").
  O pídeselo a Claude.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f6f7f9; color: #142033;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 700; }
  .brand img { width: 64px; height: 64px; border-radius: 50%; }
  h1 { font-size: 76px; line-height: 1.04; letter-spacing: -0.035em; font-weight: 800; max-width: 680px; }
  h1 .dot { margin-left: -0.08em; }
  .sub { font-size: 30px; font-weight: 500; color: #46536a; max-width: 540px; }
  .circle { position: absolute; right: 10px; bottom: -170px; width: 500px; height: 500px; border-radius: 50%; background: #e3f3eb; }
  .figure { position: absolute; right: 40px; bottom: 0; height: 520px; }
</style>
</head>
<body>
  <div class="circle"></div>
  <img class="figure" src="../public/edgar/brazos-cruzados.webp" alt="" />
  <div class="brand"><img src="../public/edgar/cara.webp" alt="" />Edgar Navarro</div>
  <h1>Marketing con IA que sí funciona<span class="dot">.</span></h1>
  <p class="sub">Videos cortos, con números reales y sin tecnicismos</p>
</body>
</html>
